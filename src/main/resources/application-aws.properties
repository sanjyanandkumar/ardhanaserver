# AWS (RDS MySQL on EC2) datasource — activate with SPRING_PROFILES_ACTIVE=aws
# Overrides the H2 datasource from application.properties. The GCP equivalent
# is application-cloud.properties; this profile differs only in how it reaches
# MySQL (plain JDBC over TLS to RDS instead of the Cloud SQL socket factory).
# DB_HOST/DB_PORT/DB_NAME/DB_USER come from the EC2 instance's infra.env and
# DB_PASSWORD from SSM Parameter Store — see deploy/aws/README.md.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=REQUIRED&connectionTimeZone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# db.t4g.micro allows ~60 connections; one EC2 instance never needs more than this.
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Same reason as application-cloud.properties: UUID fields map to CHAR(36) columns.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Schema is applied by hand (deploy/aws/init-db.ps1 for a fresh database, then a
# manual ALTER/CREATE for every later change) — same rule as the cloud profile.
spring.sql.init.mode=never

# The H2 console must never be reachable in production. CloudFront only forwards
# /api/* anyway, but disable it at the source too.
spring.h2.console.enabled=false

logging.level.com.ardhana=INFO

# Do NOT set PAYMENTS_MOCK_ENABLED / PAYOUTS_MOCK_ENABLED in production — they
# bypass Razorpay entirely. Left unset so they default to false.
