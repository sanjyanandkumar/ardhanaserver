# Plain local MySQL (e.g. installed via MySQL Installer / Homebrew / Docker)
# on your own machine — distinct from application-cloud.properties, which
# targets Cloud SQL specifically via Google's socket factory and won't work
# against a normal host:port MySQL server.
#
# Activate with: SPRING_PROFILES_ACTIVE=mysql-local
# Override connection details with env vars, e.g.:
#   DB_HOST=localhost DB_PORT=3306 DB_NAME=ardhana DB_USER=root DB_PASSWORD=yourpassword

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ardhana}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Local-only convenience: Hibernate creates missing tables/columns on
# startup and updates them as entities change. Never use "update" against
# Cloud SQL/production — it can silently leave stale columns/constraints
# behind and won't drop or rename anything safely. Production still uses
# ddl-auto=none + the hand-run schema-mysql.sql (see application-cloud.properties).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Same fix as application-cloud.properties: without this, Hibernate binds
# java.util.UUID fields as BINARY(16) on MySQL, but the schema uses
# VARCHAR(36)/CHAR(36) columns, causing "Incorrect string value" errors.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.sql.init.mode=never
