# Cloud SQL (MySQL) datasource — activate with SPRING_PROFILES_ACTIVE=cloud
# Overrides the H2 datasource from application.properties.
spring.datasource.url=jdbc:mysql:///${DB_NAME}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate 6+ defaults java.util.UUID columns to BINARY(16) on MySQL. Every
# UUID-typed entity field here (UserRole, CartItem, Order, Lesson, etc.) maps
# to a VARCHAR(36)/CHAR(36) column, not binary — without this, any insert or
# update through a UUID-typed field fails with "Incorrect string value" since
# Hibernate tries to write raw bytes into a text column.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# schema.sql is written in H2 syntax and would crash on MySQL. Auto-running
# schema-mysql.sql on startup was crashing the container in a way Cloud Run's
# logs truncate before showing the real cause — reverted to manual: run
# schema-mysql.sql yourself once via Cloud SQL Studio, then leave this off.
# IMPORTANT: this means every schema change (new table/column) needs its own
# manual ALTER/CREATE run against production Cloud SQL — nothing here applies
# automatically. schema-mysql.sql itself is reference/manual-recovery only.
spring.sql.init.mode=never

# INFO (not DEBUG) in production — enough to see checkout/Razorpay/cart
# activity and every error with its cause, without the SQL/HTTP noise DEBUG
# would add to Cloud Run's log volume. View these under Cloud Run > Logs, or
# `gcloud run services logs read ardhana-backend --region=asia-south1`.
logging.level.com.ardhana=INFO

# Do NOT set PAYMENTS_MOCK_ENABLED=true on the real production Cloud Run
# service — it bypasses Razorpay entirely and auto-confirms every order for
# free. It's meant for a local/dev database only. Left unset here on purpose
# so it defaults to false even if someone sets it globally by mistake.
