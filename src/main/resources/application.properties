spring.application.name=ardhana
# Cloud Run injects its own $PORT (usually 8080); falls back to 8085 locally
server.port=${PORT:8085}

# H2 for Java's own tables
spring.datasource.url=jdbc:h2:file:./data/ardhana;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Run schema.sql on every startup (idempotent via CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS — override with CORS_ALLOWED_ORIGINS (comma-separated) in production,
# e.g. https://your-firebase-app.web.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000,http://192.168.1.22:8080/}

# JWT auth (replaces Supabase Auth) — set JWT_SECRET to a long random string in real environments
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay — fill in real keys via env vars (RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET)
# Test keys look like rzp_test_xxx. Get them from https://dashboard.razorpay.com/app/keys
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_REPLACE_ME}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:REPLACE_ME_SECRET}
# Set this to the secret you configure on the webhook in the Razorpay dashboard
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:REPLACE_ME_WEBHOOK_SECRET}
razorpay.currency=INR

# TESTING ONLY. When true, checkout never talks to Razorpay at all: no real
# order is created and no signature is checked — every checkout auto-confirms
# and enrolls the student immediately, so you can test the full purchase flow
# without valid Razorpay keys. Set PAYMENTS_MOCK_ENABLED=true to turn it on;
# never set this in a real/production environment.
app.payments.mock-enabled=${PAYMENTS_MOCK_ENABLED:false}

# RazorpayX Payouts — used to pay teachers. This is a SEPARATE product/API
# from the razorpay.key.* above (which is for taking payments via Checkout);
# RazorpayX has its own API key pair, generated from the RazorpayX Dashboard
# (Account & Settings > API Keys), which may differ from the Checkout keys
# even though it's the same Razorpay account. Get them from
# https://x.razorpay.com
razorpayx.key.id=${RAZORPAYX_KEY_ID:rzp_test_REPLACE_ME}
razorpayx.key.secret=${RAZORPAYX_KEY_SECRET:REPLACE_ME_SECRET}
# The RazorpayX "Customer Identifier" / current account number that payouts
# are debited FROM — found in RazorpayX Dashboard > My Account & Settings >
# Banking > Customer Identifier. NOT a teacher's bank account. Differs between
# test and live mode.
razorpayx.account.number=${RAZORPAYX_ACCOUNT_NUMBER:REPLACE_ME_ACCOUNT_NUMBER}
# NEFT/RTGS/IMPS (case-sensitive, uppercase). IMPS settles fastest (usually
# instant) so it's the default; NEFT/RTGS may be cheaper depending on plan.
razorpayx.payout.mode=${RAZORPAYX_PAYOUT_MODE:IMPS}
# Must be one of Razorpay's fixed purpose values: refund/cashback/payout/
# salary/utility bill/vendor bill. Custom purposes require dashboard setup.
razorpayx.payout.purpose=${RAZORPAYX_PAYOUT_PURPOSE:payout}

# TESTING ONLY. When true, teacher payouts never call RazorpayX at all — a
# payout record is created and immediately marked PROCESSED with a fake UTR,
# no real money moves. Mirrors app.payments.mock-enabled above. Never set
# this in production.
app.payouts.mock-enabled=${PAYOUTS_MOCK_ENABLED:false}

# Without this, Spring's default error JSON omits "message" (shows "No
# message available" instead) — several endpoints (cart currency conflicts,
# admin guards, etc.) rely on the frontend reading body.message to show a
# useful toast to the user.
server.error.include-message=always

# App-level logging. DEBUG locally so checkout/Razorpay/cart flows are fully
# visible while developing; see application-cloud.properties for the
# production level (INFO — DEBUG there would be noisy/expensive on Cloud Run).
logging.level.com.ardhana=DEBUG
logging.level.org.springframework.web=INFO

# MSG91 — used to send/verify OTP SMS during signup (phone verification).
# Get your auth key from the MSG91 dashboard after signing up. No DLT
# registration is required to use MSG91's own default OTP template, but the
# SMS will show MSG91's generic sender id, not "ARDHNA", until you register
# your own DLT entity/template with them (see msg91.otp.template-id below).
msg91.auth.key=${MSG91_AUTH_KEY:REPLACE_ME_MSG91_AUTHKEY}
# Optional — leave blank to use MSG91's default OTP template. Set this once
# you've registered your own DLT template with MSG91 for branded OTP SMS.
msg91.otp.template-id=${MSG91_OTP_TEMPLATE_ID:}
msg91.otp.expiry-minutes=${MSG91_OTP_EXPIRY_MINUTES:15}

# SMTP — used to email a school's login credentials when an admin creates
# their account. Works with any SMTP provider (Gmail app password, SES SMTP
# endpoint, SendGrid/Mailgun SMTP, your own mail server, etc).
spring.mail.host=${MAIL_HOST:REPLACE_ME_SMTP_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:REPLACE_ME_SMTP_USERNAME}
spring.mail.password=${MAIL_PASSWORD:REPLACE_ME_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
# The "From" address on outgoing emails — many providers require this to
# match (or be verified against) the authenticated SMTP account.
app.mail.from=${MAIL_FROM:REPLACE_ME_SMTP_USERNAME}
# Used to build the login link in the credentials email, e.g. https://your-app.web.app/auth
app.frontend-url=${FRONTEND_URL:http://localhost:8080}