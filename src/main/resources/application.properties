spring.application.name=ardhana
server.port=8085

# H2 for Java's own tables
spring.datasource.url=jdbc:h2:file:./data/ardhana;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Run schema.sql on every startup (idempotent via CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:3000,http://192.168.1.22:8080/

